[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildyourscribe"
version = "0.1.0"
description = "Build your own local-first medical ambient scribe, one lesson at a time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "av<16",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
vosk = ["vosk>=0.3.45"]
dev = ["pytest>=8", "mkdocs-material>=9.5"]

[project.scripts]
scribe = "scribe.cli:main"

[tool.setuptools.packages.find]
include = ["scribe*"]

[tool.setuptools.package-data]
scribe = ["templates/*.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
