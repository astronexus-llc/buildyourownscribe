site_name: Build Your Scribe
site_description: Build your own local-first medical ambient scribe, one lesson at a time.
site_url: https://scribe.health201.com/
# No repo_url on purpose: with it, the theme makes every reader's browser ask
# api.github.com for star counts. The code is linked from the footer instead.
edit_uri: https://github.com/astronexus-llc/buildyourownscribe/edit/main/docs/
copyright: >-
  Part of <a href="https://health201.com">Health 201</a>.
  Code and course are MIT licensed. Not a medical device and not legal advice.

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astronexus-llc/buildyourownscribe
      name: The code on GitHub
    - icon: material/home-heart
      link: https://health201.com
      name: Health 201

# The privacy plugin downloads the fonts at build time and serves them from this
# site, so a reader's browser contacts nobody else. The hook writes the security
# headers Cloudflare Pages sends with every page.
plugins:
  - search
  - privacy

hooks:
  - hooks/csp_headers.py

extra_css:
  - https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;800&display=swap
  - assets/site.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - tables
  - toc: { permalink: true }
  - attr_list
  - md_in_html
  - pymdownx.snippets: { base_path: ['.'], check_paths: true }
  - pymdownx.tasklist: { custom_checkbox: true }

nav:
  - Home: index.md
  - Start here:
      - 0 · What an ambient scribe is: 00-what-is-an-ambient-scribe.md
      - 1 · Set up your workbench: 01-setup.md
  - Build it:
      - 2 · Record a visit: 02-record.md
      - 3 · Transcribe: 03-transcribe.md
      - 4 · Draft the note: 04-draft-note.md
      - 5 · Assemble the pipeline: 05-pipeline.md
      - 6 · The review app: 06-review-app.md
  - Make it safe:
      - 7 · Harden it: 07-harden.md
      - 8 · Evaluate it: 08-evaluate.md
  - Local or cloud:
      - All open source, no cloud: open-source.md
      - Cloud models and PHI: cloud-phi.md
  - Make it yours:
      - 9 · Templates for your specialty: 09-templates.md
      - 10 · Where to go next: 10-next.md
  - Reference:
      - Configuration: reference/configuration.md
      - Command line: reference/cli.md
      - Choosing models: reference/models.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
